<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Registration</title>
</head>
<body>
    <h1>Test Registration API</h1>
    <div id="result"></div>
    <form id="testForm" enctype="multipart/form-data">
        <input type="text" name="visitor_name" placeholder="Name" required><br>
        <input type="text" name="contact_number" placeholder="Contact" required><br>
        <input type="text" name="purpose_of_visit" placeholder="Purpose" required><br>
        <input type="text" name="home_address" placeholder="Address" required><br>
        <input type="text" name="person_to_visit" placeholder="Person to visit" required><br>
        <input type="file" name="id_attachment"><br>
        <input type="checkbox" name="privacy_consent" value="1" required> Agree<br>
        <button type="submit">Submit</button>
    </form>

    <script>
        document.getElementById('testForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Sending...';

            try {
                const response = await fetch('/api/visitor/register', {
                    method: 'POST',
                    body: formData
                });

                const text = await response.text();
                resultDiv.innerHTML = 'Response: ' + text;
                console.log('Response:', text);
            } catch (error) {
                resultDiv.innerHTML = 'Error: ' + error.message;
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
